<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · unio</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7f3;color:#25312e;font:16px system-ui}.box{width:min(390px,calc(100% - 40px));padding:30px;border:1px solid #ded6cf;border-radius:24px;background:#fff;box-shadow:0 25px 70px #25312e22}.brand{display:block;text-align:center}.brand img{width:145px}h1{margin:18px 0 8px}p{color:#4b5750;line-height:1.5}label{display:block;margin-top:18px;color:#4b5750;font-size:13px}input{display:block;width:100%;margin-top:7px;padding:13px;border-radius:11px;border:1px solid #ded6cf;background:#faf7f3;color:#25312e;box-sizing:border-box}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:11px;background:#873c56;color:#fff;font-weight:800;cursor:pointer}.switch{background:transparent;color:#873c56;margin-top:8px}.status{min-height:22px;margin-top:15px;color:#4b5750}</style><main class="box"><a class="brand" href="/"><img src="unio-logo-forest.png" alt="unio"></a><h1 id="title">Entrar</h1><p id="copy">Entre para continuar suas conexões.</p><form id="form"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" minlength="8" required autocomplete="current-password"></label><button id="submit" type="submit">Entrar</button></form><button class="switch" id="switch" type="button">Criar uma conta</button><div class="status" id="status" role="status" aria-live="polite"></div></main><script>(()=>{let register=new URLSearchParams(location.search).get('mode')==='register';const form=document.querySelector('#form'),statusEl=document.querySelector('#status'),titleEl=document.querySelector('#title'),copyEl=document.querySelector('#copy'),submitEl=document.querySelector('#submit'),switchEl=document.querySelector('#switch'),emailEl=document.querySelector('#email'),passwordEl=document.querySelector('#password');function sync(){titleEl.textContent=register?'Criar conta':'Entrar';copyEl.textContent=register?'Crie seu espaço separado para conhecer pessoas com intenção.':'Entre para continuar suas conexões.';submitEl.textContent=register?'Criar conta':'Entrar';switchEl.textContent=register?'Já tenho uma conta':'Criar uma conta';passwordEl.autocomplete=register?'new-password':'current-password'}switchEl.addEventListener('click',()=>{register=!register;sync()});sync();form.addEventListener('submit',async event=>{event.preventDefault();submitEl.disabled=true;statusEl.textContent='Processando…';try{const response=await fetch(register?'/api/auth/register':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailEl.value.trim(),password:passwordEl.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'auth_failed');localStorage.setItem('unio-user',JSON.stringify(data.user));localStorage.setItem('unio-token',data.token);statusEl.textContent='Tudo certo. Abrindo seu espaço…';location.href='app.html'}catch(error){statusEl.textContent='Não foi possível concluir: '+error.message;submitEl.disabled=false}})})();</script><script src="auth-tools.js"></script></html>
