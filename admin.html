<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>unio · Moderação</title><style>body{font:15px system-ui;margin:0;background:#faf7f3;color:#25312e}main{max-width:980px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #ded6cf;border-radius:18px;padding:20px;margin-top:16px}button{padding:8px 12px;border:0;border-radius:8px;background:#873c56;color:#fff;cursor:pointer}small{color:#4b5750}</style><main><p><a href="/">← unio</a></p><h1>Moderação</h1><p id="state">Carregando…</p><section id="list"></section></main><script>(async()=>{const token=localStorage.getItem('unio-token'),state=document.querySelector('#state'),list=document.querySelector('#list');if(!token){state.textContent='Faça login com uma conta administrativa.';return}const h={Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch('/api/admin/reports',{headers:h});if(r.status===403){state.textContent='Esta conta não tem permissão de administração.';return}if(!r.ok){state.textContent='Não foi possível carregar as denúncias.';return}const d=await r.json();state.textContent=(d.reports||[]).length+' denúncia(s)';list.innerHTML=(d.reports||[]).map(x=>'<article class="card"><strong>#'+x.id+' · '+x.status+'</strong><p>'+x.reason+'</p><small>Tipo: '+x.targetType+' · alvo: '+x.targetId+' · usuário: '+x.userId+'</small><p><button onclick="resolve('+x.id+',\'resolved\')">Resolver</button> <button onclick="resolve('+x.id+',\'dismissed\')">Arquivar</button></p></article>').join('')||'<section class="card">Nenhuma denúncia.</section>';window.resolve=async(id,status)=>{await fetch('/api/admin/reports/'+id,{method:'PATCH',headers:h,body:JSON.stringify({status})});location.reload()}})();</script>
